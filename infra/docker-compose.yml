services:
  postgres:
    image: postgres:16
    container_name: nasahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - nasahub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: nasahub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      MONITOR_STATUS_FILE: /app/backups/postgres/latest_monitor_status.json
    ports:
      - "127.0.0.1:${API_BIND_PORT:-8000}:8000"
    volumes:
      - ../backups:/app/backups:ro

  caddy:
    image: caddy:2
    container_name: nasahub-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${NASAHUB_BIND_IP:-192.168.1.28}:80:80"
      - "${NASAHUB_BIND_IP:-192.168.1.28}:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nasahub_caddy_data:/data
      - nasahub_caddy_config:/config

  ingestor:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: nasahub-ingestor
    profiles: ["manual"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
    working_dir: /app

volumes:
  nasahub_postgres_data:
  nasahub_caddy_data:
  nasahub_caddy_config:
